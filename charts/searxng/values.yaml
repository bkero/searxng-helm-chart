image:
  repository: searxng/searxng
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

resources:
  limits:
    memory: 768Mi
  requests:
    cpu: 250m
    memory: 384Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: bkero-issuer
  hosts:
    - host: search.privacyplz.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: searxng-tls
      hosts:
        - search.privacyplz.org

# Environment variables passed to the container.
# SEARXNG_SECRET and BASE_URL are the canonical env-var overrides.
env:
  BASE_URL: https://search.privacyplz.org
  INSTANCE_NAME: searxng
  AUTOCOMPLETE: "false"
  # SEARXNG_SECRET: ""  # set this to override server.secret_key below

# Contents rendered into /etc/searxng/settings.yml
searxng:
  settings:
    use_default_settings:
      engines:
        remove:
          - wikidata
    server:
      secret_key: ""  # override in deployment or via SEARXNG_SECRET env var
      bind_address: "0.0.0.0:8080"
    redis:
      url: ""  # e.g. redis://default:password@redis-master.redis.svc.cluster.local
