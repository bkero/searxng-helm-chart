{{- if not .Values.searxng.existingSecret }}
{{- /*
Preserve the secret key across upgrades by looking up any existing secret.
On first install a random value is generated; on upgrades the existing value is reused.
*/}}
{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (include "searxng.fullname" .)) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
{{- $secretKey := (get $secretData "secret-key") | b64dec }}
{{- if and (not $secretKey) .Values.searxng.secretKey }}
{{- $secretKey = .Values.searxng.secretKey }}
{{- end }}
{{- if not $secretKey }}
{{- $secretKey = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $secretKey | quote }}
{{- end }}
